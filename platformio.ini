
; ==========================================
; SMART LOCKER IoT - ESP32
; ==========================================

[env]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    mobizt/FirebaseClient @ ^2.2.13
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.0
    bblanchon/ArduinoJson @ ^7.4.3

; ==========================================
; LOCKER 01 - L01 - COM5
; ==========================================

[env:locker01]
build_flags =
    -DID_PERANGKAT=\"esp32-locker-01\"
    -DID_LOCKER=\"L01\"
    -DAKTIFKAN_SENSOR_PINTU=true
    -DDEBUG_SENSOR_PINTU=false

upload_port = COM5
monitor_port = COM5

; ==========================================
; LOCKER 02 - L02 - COM8
; ==========================================

[env:locker02]
build_flags =
    -DID_PERANGKAT=\"esp32-locker-02\"
    -DID_LOCKER=\"L02\"
    -DAKTIFKAN_SENSOR_PINTU=true
    -DDEBUG_SENSOR_PINTU=false

upload_port = COM5
monitor_port = COM5
